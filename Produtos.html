<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casa Feliz – Produtos Adicionais</title>
<style>
body { margin:0; font-family: Arial,sans-serif; background:#f9f9f9; color:#333; }
header { background:#008080; color:white; padding:20px; text-align:center; position:relative; }
header img.logo { width:260px; height:auto; display:block; margin:0 auto 10px auto; }

nav { background:#e0e0e0; display:flex; justify-content:center; padding:10px; position:sticky; top:0; z-index:1000; }
nav a { margin:0 12px; text-decoration:none; color:#008080; font-weight:bold; }
nav a:hover { color:#e65100; }

.products { display:flex; flex-wrap:wrap; justify-content:center; gap:20px; margin:20px 0; }
.product { background:white; border-radius:6px; padding:10px; max-width:220px; text-align:center; box-shadow:0 0 6px rgba(0,0,0,0.1);}
.product img { max-width:100%; border-radius:6px; transition: transform 0.3s; }
.product img:hover { transform: scale(1.05); }

.btn-azul { padding:8px 12px; border:none; border-radius:5px; cursor:pointer; font-weight:bold; display:inline-block; margin-top:5px; text-decoration:none; color:white; background:#003087; }
.btn-azul:hover { background:#0050b3; }

.produto-destaque {
  color: #c218c2; 
  font-weight: bold;
  font-size: 1.2em;
  background: #f3e5f5;
  padding: 8px;
  border-radius: 8px;
  display: inline-block;
  text-align: center;
  margin-bottom: 10px;
}

section { padding:20px; }
</style>
</head>
<body>

<header>
  <img src="images/logo.png" alt="Casa Feliz Logo" class="logo">
  <h1>Casa Feliz – Produtos Adicionais</h1>
</header>

<nav>
  <a href="index.html">Página Principal</a>
</nav>

<main>
<section id="produtos-adicionais">
  <h2>🛒 Produtos Adicionais</h2>
  <div class="products">

    <div class="product">
      <h3 class="produto-destaque">Sensor de Porta Inteligente</h3>
      <img src="sensor_porta.jpg" alt="Sensor de Porta">
      <a href="https://s.click.aliexpress.com/e/_olXyz" target="_blank" class="btn-azul">Comprar AliExpress</a>
    </div>

    <div class="product">
      <h3 class="produto-destaque">Tomada USB Inteligente</h3>
      <img src="tomada_usb.jpg" alt="Tomada USB Inteligente">
      <a href="https://s.click.aliexpress.com/e/_oABCD" target="_blank" class="btn-azul">Comprar AliExpress</a>
    </div>

    <div class="product">
      <h3 class="produto-destaque">Câmera WiFi 360°</h3>
      <img src="camera360.jpg" alt="Câmera WiFi 360">
      <a href="https://s.click.aliexpress.com/e/_oXYZ" target="_blank" class="btn-azul">Comprar AliExpress</a>
    </div>

  </div>

  <!-- Botão voltar à página principal -->
  <div style="text-align:center; margin-top:25px;">
    <a href="index.html" class="btn-azul">Voltar à página principal</a>
  </div>

</section>
</main>

<footer style="background:#008080; color:white; text-align:center; padding:15px; margin-top:40px;">
  Casa Feliz © 2025 — Criado por Carlos Oliveira
</footer>

</body>
</html>
